<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff9e7a">
<title>黏黏吞噬史</title>
<style>
  :root { --pink: #ff4fd8; --cyan: #38f0ff; --ink: #2a1d3d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffb08a; font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; }
  .stroke { text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; }
  .pill { background: rgba(42, 29, 61, .72); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; backdrop-filter: blur(4px); }
  #kg { position: fixed; left: 16px; bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: none; }
  #kg .label { font-size: 12px; font-weight: 700; opacity: .9; letter-spacing: 2px; }
  #kg .num { font-size: 40px; font-weight: 900; line-height: 1; }
  #kg .num small { font-size: 18px; }
  #tierbar { width: 150px; height: 6px; border-radius: 3px; background: rgba(42,29,61,.5); margin-top: 6px; overflow: hidden; }
  #tierbar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  #kg .next { font-size: 11px; margin-top: 4px; font-weight: 700; }
  #skill { position: fixed; right: 18px; bottom: max(22px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; border: 4px solid #fff; background: conic-gradient(rgba(42,29,61,.75) var(--cd, 0%), var(--pink) 0); display: grid; place-items: center; font-size: 34px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
  #skill span { position: absolute; bottom: -20px; font-size: 13px; font-weight: 800; white-space: nowrap; }
  #skill.active { animation: pulse .3s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.1); } }
  #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; font-size: clamp(26px, 7vw, 54px); font-weight: 900; pointer-events: none; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .25s cubic-bezier(.3,1.6,.5,1); padding: 0 16px; }
  #banner.show { opacity: 1; transform: scale(1); }
  #banner .sub { display: block; font-size: .5em; color: #fff3a0; margin-top: 6px; }
  #floats { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .float { position: absolute; font-weight: 900; font-size: 20px; animation: floatUp .9s ease-out forwards; white-space: nowrap; transform: translate(-50%, -50%); }
  .float.big { font-size: 34px; color: #fff3a0; }
  @keyframes floatUp { from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -60px; } }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6); background: rgba(42,29,61,.2); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.85); transform: translate(-50%,-50%); }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(42, 29, 61, .55); backdrop-filter: blur(3px); padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  #cards h2 { margin: 0 0 14px; font-size: 26px; }
  .card { width: min(340px, 100%); background: #fff; color: var(--ink); border-radius: 18px; padding: 14px 16px; margin: 7px 0; display: flex; gap: 14px; align-items: center; cursor: pointer; box-shadow: 0 5px 0 var(--ink); border: 3px solid var(--ink); transition: transform .1s; }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .card .ic { font-size: 34px; }
  .card b { font-size: 19px; display: block; }
  .card small { font-size: 14px; opacity: .8; }
  #cardtimer { width: min(340px, 100%); height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #cardtimer div { height: 100%; background: #fff; width: 100%; }
  #start h1 { font-size: clamp(44px, 13vw, 84px); margin: 0; line-height: 1.05; text-align: center; }
  #start p { font-size: 16px; margin: 10px 0 26px; text-align: center; opacity: .95; }
  .btn { font: inherit; font-size: 24px; font-weight: 900; color: var(--ink); background: #fff3a0; border: 4px solid var(--ink); border-radius: 999px; padding: 12px 44px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  #start .tips { font-size: 13px; opacity: .85; margin-top: 22px; text-align: center; line-height: 1.7; }
  #altar { position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%); background: rgba(42,29,61,.85); border-radius: 18px; padding: 12px 18px; text-align: center; display: none; border: 3px solid #fff; min-width: 240px; }
  #altar.show { display: block; }
  #altar .vs { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  #altar .verdict { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  #altar .btn { font-size: 19px; padding: 8px 30px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
  <div id="hud"><div class="pill" id="remain">剩余 0</div><div class="pill" id="timer">00:00</div></div>
  <div id="kg" class="stroke"><div class="label">体重</div><div class="num"><span id="kgnum">0</span><small> kg</small></div><div id="tierbar"><div></div></div><div class="next" id="nexttier"></div></div>
  <div id="skill" class="ui-block stroke">🫧<span>膨胀</span></div>
  <div id="banner" class="stroke"></div>
  <div id="floats"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="altar" class="ui-block"><div class="vs" id="altarvs"></div><div class="verdict" id="altarverdict"></div><button class="btn" id="summon">召唤 Boss</button></div>
  <div id="cards" class="overlay ui-block"><h2 class="stroke">选择一项进化</h2><div id="cardlist"></div><div id="cardtimer"><div></div></div></div>
  <div id="start" class="overlay show ui-block">
    <h1 class="stroke">黏黏<br>吞噬史</h1>
    <p class="stroke">把整座城市一口一口吞掉</p>
    <button class="btn" id="startbtn">开吃！</button>
    <div class="tips stroke">手机：按住屏幕拖动 · 电脑：WASD / 方向键<br>技能「膨胀」：空格 / 右下角按钮<br>城市里的物件由 Hi3D 生成</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
